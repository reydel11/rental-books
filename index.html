/* Layout: sticky brand bar + scrollable section tabs; content column max 1180px; records as cards on phone, rows on desktop; add/edit in a bottom sheet. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#EAEEF3; --line:#D6DCE4;
  --fg:#16212F; --muted:#5B6878; --ink:#14304F; --brass:#A8761C; --brass-soft:#F3E7CF;
  --good:#1E7A4C; --good-bg:#DDF1E5; --warn:#8A5A00; --warn-bg:#FBEBC6; --bad:#B3261E; --bad-bg:#F8DCD9;
  --c1:#14304F; --c2:#C99A3B; --c3:#7F9CC4; --c4:#2E8B57;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --fg:#E7ECF2; --muted:#98A5B5; --ink:#9FC0E8; --brass:#E0B25A; --brass-soft:#3A2F1A;
  --good:#6FD39C; --good-bg:#173527; --warn:#F1C66B; --warn-bg:#3A2E12; --bad:#FF8A80; --bad-bg:#3D1C1A;
  --c1:#9FC0E8; --c2:#E0B25A; --c3:#5D7BA6; --c4:#6FD39C;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141C; --surface:#161E29; --surface-2:#1E2836; --line:#2B3747;
  --fg:#E7ECF2; --muted:#98A5B5; --ink:#9FC0E8; --brass:#E0B25A; --brass-soft:#3A2F1A;
  --good:#6FD39C; --good-bg:#173527; --warn:#F1C66B; --warn-bg:#3A2E12; --bad:#FF8A80; --bad-bg:#3D1C1A;
  --c1:#9FC0E8; --c2:#E0B25A; --c3:#5D7BA6; --c4:#6FD39C;

*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
.signin{max-width:420px;margin:12vh auto 0;text-align:center}
.signin .mark{width:56px;height:56px;margin:0 auto 16px;border-radius:12px}
.signin h2{margin-bottom:6px}
.signin p{color:var(--muted);margin:0 0 20px}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.mark{width:30px;height:30px;border-radius:7px;background:var(--ink);display:grid;place-items:center;flex:none}
.mark svg{display:block}
.brand h1{font-family:var(--f-display);font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tools{display:flex;gap:8px;align-items:center}
select.year{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-family:var(--f-num)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:5px 10px;font-size:13px}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.rec:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

nav.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px 11px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap;border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--brass)}
main{padding-block:20px 60px}
h2{font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:-.015em;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-size:16px;font-weight:600;margin:0 0 10px}
.viewhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.viewhead p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .lab{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .val{font-family:var(--f-num);font-size:20px;font-weight:500;margin-top:4px}
.kpi.hero{background:var(--ink);border-color:var(--ink)}
.kpi.hero .lab,.kpi.hero .val{color:var(--surface)}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:2px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}

.chart svg{width:100%;height:auto;display:block}

.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 11px;border-radius:8px;background:var(--surface-2);cursor:pointer;border:0;text-align:left;width:100%}
.alert b{font-family:var(--f-num)}

.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.ok{background:var(--good-bg);color:var(--good)}
.bars{display:flex;flex-direction:column;gap:7px}
.barrow{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:4px 10px;align-items:center;font-size:13px}
.barrow .track{grid-column:1/-1;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.barrow .fill{height:100%;background:var(--brass);border-radius:3px}
.barrow .amt{text-align:right}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.r,th.r{text-align:right}
tr.total td{font-weight:600;background:var(--surface-2)}
.neg{color:var(--bad)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters input,.filters select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
.filters input{flex:1 1 200px}
.sumline{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:10px}

.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rec{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:4px 14px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.rec:last-child{border-bottom:0}
.rec:hover{background:var(--surface-2)}

.rec .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec .s{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--muted);margin-left:6px;vertical-align:1px}
.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.good{background:var(--good-bg);color:var(--good)}.pill.ex{background:var(--brass-soft);color:var(--brass)}
.empty{padding:34px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--fg);font-family:var(--f-display);font-size:16px;margin-bottom:4px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--brass-soft);color:var(--fg);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;font-size:13px}
.notice{padding:10px 14px;border-radius:var(--r);background:var(--surface-2);color:var(--muted);font-size:13px;margin-bottom:14px}
.grid-rc td{text-align:center;font-family:var(--f-num);font-size:12px;padding:7px 6px}
.grid-rc td.l{text-align:left;font-family:var(--f-body);font-size:13px}
.c-paid{background:var(--good-bg);color:var(--good)}.c-part{background:var(--warn-bg);color:var(--warn)}.c-late{background:var(--bad-bg);color:var(--bad)}.c-out{color:var(--line)}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,18,28,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.overlay{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.sheet{border-radius:14px}}
.sheet h3{font-size:19px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:480px){.form{grid-template-columns:1fr}}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.field textarea{min-height:70px;resize:vertical}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:3px}
.sheetfoot{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:18px;flex-wrap:wrap}
.sheetfoot .right{display:flex;gap:8px;margin-left:auto}
.calc{grid-column:1/-1;background:var(--surface-2);border-radius:8px;padding:9px 12px;font-size:13px;color:var(--muted)}
.calc b{color:var(--fg);font-family:var(--f-num);font-weight:500}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:60;font-weight:600;font-size:13px}
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.ratetable input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.muted{color:var(--muted)}
.fine{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}}
</style>

/* ----- Dashboard ----- */
function totals(y=S.year,prop=null){
  const P=r=>prop===null||(r.property||"")===prop;
  const inc=S.data.income.filter(r=>inYear(r.date,y)&&P(r));
  const exp=S.data.expenses.filter(r=>inYear(r.date,y)&&P(r));
  const rep=S.data.repairs.filter(r=>inYear(r.paid,y)&&P(r));
  const imp=S.data.improvements.filter(r=>inYear(r.date,y)&&P(r));
  const trp=S.data.trips.filter(r=>inYear(r.date,y)&&(prop===null||(r.destination||"")===prop));
  const sum=(a,f)=>a.reduce((s,r)=>s+n(f(r)),0);
  const t={income:sum(inc,r=>r.amount),expenses:sum(exp,r=>r.amount),repairs:sum(rep,r=>r.cost),
    mileage:sum(trp,r=>tripDeduction(r)+n(r.tolls)),improvements:sum(imp,r=>r.cost),miles:sum(trp,tripMiles),inc,exp,rep,imp,trp};
  t.net=t.income-t.expenses-t.repairs-t.mileage;
  return t;
}
function monthly(){const M=MONTHS.map(()=>({inc:0,exp:0,rep:0,mil:0}));
  for(const r of S.data.income)if(inYear(r.date))M[monthIdx(r.date)].inc+=n(r.amount);
  for(const r of S.data.expenses)if(inYear(r.date))M[monthIdx(r.date)].exp+=n(r.amount);
  for(const r of S.data.repairs)if(inYear(r.paid))M[monthIdx(r.paid)].rep+=n(r.cost);
  for(const r of S.data.trips)if(inYear(r.date))M[monthIdx(r.date)].mil+=tripDeduction(r)+n(r.tolls);
  return M}
function rentStatus(){ // per tenant, per month
  const today=todayISO();const out=[];
  for(const t of S.data.tenants){
    const row={t,months:[],collected:0,due:0};
    for(let m=0;m<12;m++){
      const ms=`${S.year}-${String(m+1).padStart(2,"0")}`;
      const first=ms+"-01";
      const inLease=(!t.start||first>=t.start.slice(0,7)+"-01")&&(!t.end||first<=t.end);
      if(!inLease){row.months.push(null);continue}
      const paid=S.data.income.filter(r=>r.category==="Rent"&&(r.property||"")===(t.property||"")&&(r.unit||"")===(t.unit||"")&&((r.forMonth?r.forMonth.slice(0,7):(r.date||"").slice(0,7))===ms)).reduce((s,r)=>s+n(r.amount),0);
      const dueDate=new Date(S.year,m,Math.max(1,n(t.dueDay)||1)+5);
      const past=dueDate<new Date(today+"T00:00:00");
      if(past)row.due+=n(t.rent);
      row.collected+=paid;
      row.months.push({paid,past,rent:n(t.rent)});
    }
    row.owed=Math.max(0,row.due-row.collected);
    out.push(row);
  }
  return out.sort((a,b)=>(a.t.property||"").localeCompare(b.t.property||"")||(a.t.unit||"").localeCompare(b.t.unit||""));
}
function chartSVG(M){
  const W=640,H=230,L=52,R=10,T=10,B=26;const iw=W-L-R,ih=H-T-B;
  const maxv=Math.max(1,...M.map(x=>Math.max(x.inc,x.exp+x.rep+x.mil)));
  const step=niceStep(maxv/4);const top=Math.ceil(maxv/step)*step;
  const y=v=>T+ih-(v/top)*ih;const bw=iw/12;
  let g="";
  for(let v=0;v<=top+1e-9;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${short$(v)}</text>`}
  M.forEach((x,i)=>{const x0=L+i*bw+bw*.22,w=bw*.56;let base=0;
    [["exp","var(--c1)"],["rep","var(--c2)"],["mil","var(--c3)"]].forEach(([k,c])=>{if(x[k]>0){g+=`<rect x="${x0}" y="${y(base+x[k])}" width="${w}" height="${Math.max(0,y(base)-y(base+x[k]))}" fill="${c}" rx="1.5"><title>${MONTHS[i]} ${k==="exp"?"operating":k==="rep"?"repairs":"mileage"}: ${fmt$(x[k])}</title></rect>`;base+=x[k]}});
    g+=`<text x="${L+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${MONTHS[i]}</text>`});
  const pts=M.map((x,i)=>`${L+i*bw+bw/2},${y(x.inc)}`).join(" ");
  g+=`<polyline points="${pts}" fill="none" stroke="var(--c4)" stroke-width="2.25" stroke-linejoin="round"/>`;
  M.forEach((x,i)=>{g+=`<circle cx="${L+i*bw+bw/2}" cy="${y(x.inc)}" r="3" fill="var(--surface)" stroke="var(--c4)" stroke-width="2"><title>${MONTHS[i]} income: ${fmt$(x.inc)}</title></circle>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly income versus expenses">${g}</svg>`;
}
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(Math.max(x,1))));const f=x/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function short$(v){return v>=1e6?"$"+(v/1e6).toFixed(1)+"M":v>=1e3?"$"+(v/1e3).toFixed(v%1000?1:0)+"k":"$"+v}

  let rows=S.data[c].slice();

  if(yearScoped)rows=rows.filter(r=>c==="repairs"?(inYear(r.reported)||inYear(r.paid)||OPEN_STATUS.has(r.status)):inYear(r[dk]));
  if(f.prop)rows=rows.filter(r=>(r.property||r.destination||"")===f.prop);
  if(f.q){const q=f.q.toLowerCase();rows=rows.filter(r=>Object.values(r).some(v=>String(v).toLowerCase().includes(q)))}
  if(dk)rows.sort((a,b)=>(b[dk]||"").localeCompare(a[dk]||"")||(b._ts||0)-(a._ts||0));
  else rows.sort((a,b)=>String(a.name||"").localeCompare(String(b.name||"")));
  return {rows,f,dk,yearScoped};
}

/* ----- Schedule E ----- */
function schedECols(){
  const props=[GENERAL,...propNames()];
  const lineOfExp=c=>{const m=S.settings.expenseCats||{};return m[c]!==undefined?n(m[c]):19};
  const col=p=>{const L=Object.fromEntries(SCHE.map(([k])=>[k,0]));const P=r=>p===null||(r.property||"")===p;
    for(const r of S.data.income)if(inYear(r.date)&&P(r)&&r.category!=="Interest Income"&&r.category!=="Insurance Claim Proceeds")L[3]+=n(r.amount);
    for(const r of S.data.expenses)if(inYear(r.date)&&P(r))L[lineOfExp(r.category)]=(L[lineOfExp(r.category)]||0)+n(r.amount);
    for(const r of S.data.repairs)if(inYear(r.paid)&&P(r))L[14]+=n(r.cost);
    for(const r of S.data.trips)if(inYear(r.date)&&(p===null||(r.destination||"")===p))L[6]+=tripDeduction(r)+n(r.tolls);
    L[18]=S.data.properties.filter(x=>p===null||x.name===p).reduce((s,x)=>s+propDep(x),0)+S.data.improvements.filter(x=>P(x)).reduce((s,x)=>s+impDep(x),0);
    L.t20=SCHE.filter(([k])=>k>=5).reduce((s,[k])=>s+L[k],0);L.t21=L[3]-L.t20;return L};
  return [["All properties",col(null)],...props.map(p=>[p,col(p)])].filter(([p,L],i)=>i===0||p!==GENERAL||L[3]||L.t20);
}
function vSchedE(){
  const cols=schedECols();
  const other=S.data.income.filter(r=>inYear(r.date)&&(r.category==="Interest Income"||r.category==="Insurance Claim Proceeds")).reduce((s,r)=>s+n(r.amount),0);
  const cell=v=>`<td class="r num ${v<0?"neg":""}">${fmt$(v)}</td>`;
  return `<div class="viewhead"><div><h2>Schedule E · ${S.year}</h2><p>Your year sorted into IRS Schedule E (Form 1040) Part I lines, by property. Give this to your CPA. Costs under General / Company need to be split across properties, and depreciation here is a straight-line estimate.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap">${pdfBtn("schede")}${S.dl?`<button class="btn small" id="exportE">Export CSV</button>`:""}</div></div>

  ${SCHE.map(([k,d])=>`<tr><td class="num">${k}</td><td>${d}</td>${cols.map(([,L])=>cell(L[k])).join("")}</tr>`).join("")}
  <tr class="total"><td class="num">20</td><td>Total expenses (5–19)</td>${cols.map(([,L])=>cell(L.t20)).join("")}</tr>
  <tr class="total"><td class="num">21</td><td>Income or (loss)</td>${cols.map(([,L])=>cell(L.t21)).join("")}</tr>
  </tbody></table></div></div>
  <div class="panel" style="margin-top:14px"><h3>Not on Schedule E: review with your CPA</h3><table><tbody>
  <tr><td>Interest income and insurance claim proceeds</td>${cell(other)}</tr>

  <p class="fine" style="margin-top:10px">Expense categories map to lines in Settings. Truck trips count under a property only when the destination is that property's name.</p></div>`;
}

/* ---------- binding ---------- */
function bindView(){
  const m=$("#main");
  m.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>openForm(b.dataset.add));

  m.querySelectorAll("[data-export]").forEach(b=>b.onclick=()=>exportCSV(b.dataset.export));
  m.querySelectorAll("[data-pdf]").forEach(b=>b.onclick=async()=>{const t=b.textContent;b.disabled=true;b.textContent="Making PDF…";try{await makePDF(b.dataset.pdf)}finally{b.disabled=false;b.textContent=t}});
  m.querySelectorAll("[data-print]").forEach(b=>b.onclick=async()=>{const w=window.open("","_blank");const t=b.textContent;b.disabled=true;b.textContent="Preparing…";try{await makePDF(b.dataset.print,w)}finally{b.disabled=false;b.textContent=t}});
  const c=S.view;

  if(q)q.oninput=()=>{S.filters[c].q=q.value;const pos=q.selectionStart;render();const nq=$(`#q-${c}`);nq.focus();nq.setSelectionRange(pos,pos)};
  if(p)p.onchange=()=>{S.filters[c].prop=p.value;render()};
  if(a)a.onchange=()=>{S.filters[c].all=a.value==="1";render()};
  $("#clearEx")&&($("#clearEx").onclick=clearExamples);
  $("#saveSettings")&&($("#saveSettings").onclick=saveSettings);
  $("#backup")&&($("#backup").onclick=backup);
  $("#importFile")&&($("#importFile").onchange=e=>importBackup(e.target.files[0]));
  bindSharing();
  $("#exportE")&&($("#exportE").onclick=exportSchedE);
}

function openForm(c,r){
  const sc=SCHEMAS[c];const isNew=!r;

    if(c==="trips"&&!tripMiles(o)){$("#ferr").hidden=false;$("#ferr").textContent="Enter start and end odometer, or the miles driven.";return}
    if(c==="properties"&&S.data.properties.some(p=>p.name===o.name&&p._id!==r?._id)){$("#ferr").hidden=false;$("#ferr").textContent="Another property already uses that name.";return}

/* ---------- persistence ---------- */
async function saveRec(c,id,o,prev){
  o._ts=Date.now();if(prev?._created)o._created=prev._created;else o._created=o._ts;
  if(!S.db){const i=id||("local-"+Math.random().toString(36).slice(2));const arr=S.data[c];const k=arr.findIndex(x=>x._id===i);const rec={...o,_id:i};if(k>=0)arr[k]=rec;else arr.push(rec);render();return true}
  try{const ref=id?S.db.collection(c).doc(id):S.db.collection(c).doc();await ref.set(o);return true}
  catch(e){showErr(e);return false}
}
async function removeRec(c,id){

/* ---------- import ---------- */
async function importBackup(file){
  const msg=$("#importMsg");if(!file)return;
  let o;try{o=JSON.parse(await file.text())}catch(e){msg.textContent="That file isn't a valid backup.";return}
  const jobs=[];
  for(const c of COLLS)for(const r of (o[c]||[])){const {_id,...rest}=r;if(!_id)continue;jobs.push([S.db.collection(c).doc(String(_id)),rest])}
  if(o.settings)jobs.push([S.db.doc("config/settings"),o.settings]);
  if(!jobs.length){msg.textContent="No records found in that file.";return}
  msg.textContent=`Importing ${jobs.length} records…`;
  try{let doneN=0;for(let i=0;i<jobs.length;i+=20){await Promise.all(jobs.slice(i,i+20).map(([ref,data])=>ref.set(data)));doneN+=Math.min(20,jobs.length-i);msg.textContent=`Importing… ${doneN} of ${jobs.length}`}
    if(o.settings?.company&&S.isOwner&&S.bookRef)await S.bookRef.update({name:o.settings.company});
    msg.textContent=`Imported ${jobs.length} records.`;toast("Backup imported")}
  catch(e){showErr(e);msg.textContent="Import stopped. Nothing after the error was saved."}
}

    ${others.length?`<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:10px">${others.map(x=>`<button class="btn" data-open-book="${esc(x.id)}" style="justify-content:space-between"><span>${esc(x.name||"Untitled books")}</span><span class="fine">Open</span></button>`).join("")}</div>`:""}
    <div class="form"><div class="field full"><label for="newBookName">New books name</label><input id="newBookName" placeholder="e.g. Stelo Holdings"></div></div>
    <button class="btn" id="newBook" style="margin-top:10px">Create new books</button></div>`;
}
function bindSharing(){
  const m=$("#main");
  m.querySelectorAll("[data-open-book]").forEach(b=>b.onclick=()=>openBook(b.dataset.openBook));
  m.querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{if(!b.dataset.armed){b.dataset.armed=1;b.textContent="Tap again to remove";return}
    try{await S.bookRef.update({members:firebase.firestore.FieldValue.arrayRemove(b.dataset.rm)});toast("Access removed")}catch(e){showErr(e)}});
  const add=$("#addMember");if(add)add.onclick=async()=>{const el=$("#newMember");const v=el.value.trim().toLowerCase();const msg=$("#shareMsg");
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){msg.textContent="Enter a full email address.";return}
    if((S.book.members||[]).includes(v)){msg.textContent="That person already has access.";return}
    if((S.book.members||[]).length>=20){msg.textContent="A set of books can have up to 20 people.";return}
    try{await S.bookRef.update({members:firebase.firestore.FieldValue.arrayUnion(v)});el.value="";msg.textContent=`${v} can now sign in at ${APP_URL} with that Google account.`}catch(e){showErr(e)}};
  const cp=$("#copyLink");if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(APP_URL);toast("Link copied")}catch(e){$("#shareMsg").textContent=APP_URL}};
  const nb=$("#newBook");if(nb)nb.onclick=async()=>{const name=$("#newBookName").value.trim();if(!name){$("#newBookName").focus();return}nb.disabled=true;const id=await createBook(name);nb.disabled=false;if(id)openBook(id)};
}
async function createBook(name){
  const db=firebase.firestore();const ref=db.collection("books").doc();
  try{await ref.set({name,owner:S.uid,ownerEmail:S.email,members:[S.email],created:firebase.firestore.FieldValue.serverTimestamp()});
    await ref.collection("config").doc("settings").set({...DEFAULTS,company:name});toast("Books created");return ref.id}
  catch(e){showErr(e);return null}
}
function welcomeView(){
  S.ready=true;$("#tabs").hidden=true;$("#quickAdd").hidden=true;$("#yearSel").parentElement.hidden=true;$("#coName").textContent="Rental Books";
  $("#main").innerHTML=`<div class="signin"><h2>Welcome</h2><p>Signed in as ${esc(S.email)}. Create your books to start tracking your rentals. If someone invited you, ask them to add this exact email, then reload.</p>
    <div class="field" style="text-align:left;margin-bottom:12px"><label for="firstBook">Company or books name</label><input id="firstBook" placeholder="e.g. Capital Edge Properties"></div>
    <button class="btn primary" id="mkFirst" style="padding:11px 20px">Create my books</button></div>`;
  $("#mkFirst").onclick=async()=>{const name=$("#firstBook").value.trim()||"My Rental Books";$("#mkFirst").disabled=true;const id=await createBook(name);if(id)openBook(id);else $("#mkFirst").disabled=false};
}

/* ---------- boot (Firebase, multi-user) ---------- */
S.dl={save:async({filename,data})=>{const url=URL.createObjectURL(data);const a=document.createElement("a");a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}};
renderTabs();render();
function signInView(err){
  $("#tabs").hidden=true;$("#quickAdd").hidden=true;$("#signOut").hidden=true;$("#yearSel").parentElement.hidden=true;$("#bookSel").hidden=true;
  $("#coName").textContent="Rental Books";document.title="Rental Books";
  $("#main").innerHTML=`<div class="signin"><div class="mark" style="display:grid;place-items:center"><svg width="30" height="30" viewBox="0 0 18 18"><path d="M2 15V8l7-5 7 5v7" fill="none" stroke="var(--brass)" stroke-width="2" stroke-linejoin="round"/><path d="M7 15v-4h4v4" fill="none" stroke="var(--brass)" stroke-width="2"/></svg></div>
    <h2>Rental Books</h2><p>Income, expenses, repairs, mileage, rent roll and Schedule E for your rental properties. Sign in with Google to open your books.</p>
    <button class="btn primary" id="gIn" style="padding:11px 20px">Sign in with Google</button>${err?`<p class="fine" style="color:var(--bad);margin-top:16px">${esc(err)}</p>`:""}
    <p class="fine" style="margin-top:28px">Your records are private to you and the people you invite. This is a record-keeping tool, not tax advice.</p></div>`;
  $("#gIn").onclick=async()=>{const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});
    try{await firebase.auth().signInWithPopup(p)}catch(e){if(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment"){await firebase.auth().signInWithRedirect(p)}else if(e.code!=="auth/popup-closed-by-user"&&e.code!=="auth/cancelled-popup-request")signInView(e.code==="auth/unauthorized-domain"?"This web address isn't on Firebase's Authorized domains list yet.":"Sign-in didn't work: "+(e.message||e.code))}};
}
let dataUnsubs=[],booksUnsub=null;
function stopData(){dataUnsubs.forEach(u=>u());dataUnsubs=[]}
function openBook(id){
  const b=(S.books||[]).find(x=>x.id===id);if(!b)return;
  if(S.book&&S.book.id===id&&dataUnsubs.length){S.book=b;S.isOwner=b.owner===S.uid;render();return}
  stopData();const db=firebase.firestore();const bookRef=db.collection("books").doc(id);
  S.book=b;S.bookRef=bookRef;S.isOwner=b.owner===S.uid;
  try{localStorage.setItem("rb.book",id)}catch(e){}
  S.db={collection:c=>bookRef.collection(c),doc:p=>{const [c,d]=p.split("/");return bookRef.collection(c).doc(d)},batch:()=>db.batch()};
  for(const c of COLLS)S.data[c]=[];S.settings={...DEFAULTS,company:b.name};S.canWrite=true;S.ready=false;
  $("#tabs").hidden=false;$("#yearSel").parentElement.hidden=false;render();
  const pending=new Set(COLLS.concat("settings"));const done=k=>{if(pending.delete(k)&&!pending.size)S.ready=true};
  const fail=(k,e)=>{done(k);if(e&&e.code==="permission-denied"){S.canWrite=false}if(S.ready)render()};
  for(const c of COLLS)dataUnsubs.push(bookRef.collection(c).onSnapshot(snap=>{S.data[c]=snap.docs.map(d=>({...d.data(),_id:d.id}));done(c);if(S.ready)render()},e=>fail(c,e)));
  dataUnsubs.push(bookRef.collection("config").doc("settings").onSnapshot(snap=>{S.settings=snap.exists?{...DEFAULTS,...snap.data()}:{...DEFAULTS,company:b.name};done("settings");if(S.ready&&(S.view!=="settings"||!document.activeElement?.closest?.("#main")))render()},e=>fail("settings",e)));
}
(function boot(){
  if(!window.firebase||String(FIREBASE_CONFIG.apiKey).startsWith("PASTE")){S.ready=true;$("#main").innerHTML=`<div class="empty"><strong>Firebase isn't set up yet</strong>Paste your Firebase config into index.html (search for PASTE YOUR FIREBASE CONFIG), upload it again, and reload.</div>`;return}
  firebase.initializeApp(FIREBASE_CONFIG);
  const db=firebase.firestore();
  firebase.auth().getRedirectResult().catch(()=>{});
  $("#signOut").onclick=()=>firebase.auth().signOut();
  firebase.auth().onAuthStateChanged(user=>{
    stopData();if(booksUnsub){booksUnsub();booksUnsub=null}
    S.book=null;S.books=[];S.db=null;for(const c of COLLS)S.data[c]=[];S.settings={...DEFAULTS};
    if(!user){S.ready=false;signInView();return}
    S.uid=user.uid;S.email=String(user.email||"").toLowerCase();
    $("#signOut").hidden=false;$("#yearSel").parentElement.hidden=false;S.ready=false;render();
    booksUnsub=db.collection("books").where("members","array-contains",S.email).onSnapshot(snap=>{
      S.books=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.name).localeCompare(String(b.name)));
      if(!S.books.length){stopData();S.book=null;S.db=null;welcomeView();return}
      let want=S.book?.id;if(!want){try{want=localStorage.getItem("rb.book")}catch(e){}}
      if(!S.books.some(b=>b.id===want))want=S.books[0].id;
      openBook(want);
    },e=>{signInView("Couldn't load your books: "+(e.message||e.code))});
  });
})();
})();
</script>
</body>
